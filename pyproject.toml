[project]
name = "adventofcode25"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
day1 = "day1.solution:run"
day2 = "day2.solution:run"
day3 = "day3.solution:run"
day4 = "day4.solution:run"
day5 = "day5.solution:run"
day6 = "day6.solution:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["day1", "day2", "day3", "day4", "day5", "day6"]
